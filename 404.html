<script>
// Apps like Instagram turn "#" into "%23" (e.g. /%23contact). Send those visitors to the right section.
(function () {
  var p = location.pathname, i = p.toLowerCase().indexOf("%23");
  if (i !== -1) location.replace(p.slice(0, i) + "#" + decodeURIComponent(p.slice(i + 3)));
})();
</script>
